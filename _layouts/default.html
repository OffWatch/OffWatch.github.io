<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <style>
    body {
      max-width: 72ch;
      margin: 2rem auto;
      padding: 0 1rem;
      font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #111;
      background: #fafafa;
    }
    a { color: #0645ad; }
    h1, h2, h3 { font-size: 1.15rem; margin-top: 1.8rem; }
    hr { border: 0; border-top: 1px solid #ccc; margin: 1.5rem 0; }
    ul { padding-left: 1.2rem; }
    pre, code {
      font-family: inherit;
      background: #f0f0f0;
    }
    pre {
      padding: 0.8rem 1rem;
      overflow-x: auto;
      border: 1px solid #ddd;
    }
    code { padding: 0.1rem 0.25rem; }
    pre code { padding: 0; background: none; }
    .meta { color: #555; font-size: 0.9rem; }
    nav { margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <nav><a href="{{ '/' | relative_url }}">{{ site.title }}</a></nav>
  {{ content }}
  <hr>
  <p class="meta"><a href="https://github.com/OffWatch">github.com/OffWatch</a></p>
</body>
</html>
